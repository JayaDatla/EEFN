name: EEFN CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
    - name: Create the database schema
      run: |
        cd backend
        alembic upgrade head
    - name: Run Backend Tests
      run: |
        cd backend
        pytest tests/ -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    - name: Run Linter and Build
      run: |
        cd frontend
        npm run lint
        npm run build

  # Builds both images on every branch so a broken Dockerfile is caught; images are pushed to ghcr.io only from main.
  docker-build-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Lowercase the image name
      run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
    - name: Log in to GitHub Container Registry
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Backend Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/backend.Dockerfile
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: |
          ${{ env.IMAGE }}/backend:latest
          ${{ env.IMAGE }}/backend:${{ github.sha }}
    - name: Build and push Frontend Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/frontend.Dockerfile
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: |
          ${{ env.IMAGE }}/frontend:latest
          ${{ env.IMAGE }}/frontend:${{ github.sha }}
