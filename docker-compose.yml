version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eefn_postgres
    environment:
      POSTGRES_USER: eefn_user
      POSTGRES_PASSWORD: eefn_password
      POSTGRES_DB: eefn_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eefn_user -d eefn_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eefn_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: eefn_backend
    environment:
      - DATABASE_URL=postgresql://eefn_user:eefn_password@postgres:5432/eefn_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: eefn_worker
    command: arq app.worker.WorkerSettings
    environment:
      - DATABASE_URL=postgresql://eefn_user:eefn_password@postgres:5432/eefn_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: eefn_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
