[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eefn"
version = "0.1.0"
description = "EEFN -- an automated cross-catalog evidence auditor for transiting planet candidates."
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "alembic==1.19.1",
    "pydantic==2.5.2",
    "pydantic-settings==2.1.0",
    "pandas==2.1.3",
    "numpy==1.26.2",
    "scikit-learn==1.3.2",
    "requests==2.31.0",
    "python-multipart==0.0.6",
    "torch==2.10.0",
    "redis==5.3.1",
    "arq==0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "requests-mock==1.12.1",
    "fakeredis==2.37.0",
    "lupa==2.8",
]

[project.scripts]
eefn = "eefn.cli:main"

[tool.setuptools]
packages = ["eefn", "app", "app.api", "app.db", "app.ml", "app.models", "app.pipeline", "app.science", "services"]
